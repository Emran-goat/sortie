<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rust Pirate x Kubernetes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0e1a;
  }
  .card {
    position: relative;
    width: 780px;
    max-width: 95vw;
    border-radius: 32px;
    overflow: hidden;
    background: linear-gradient(170deg, #0d1b2a 0%, #162338 50%, #0d1220 100%);
    box-shadow: 0 30px 80px rgba(0,0,0,0.8);
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 500px 350px at 50% 55%, rgba(222,58,42,0.06), transparent);
    pointer-events: none;
  }
  .inner { position: relative; padding: 30px 40px 40px; z-index: 1; }
  .scene { display: flex; align-items: center; justify-content: center; margin: 10px 0; }
  .scene svg { width: 100%; height: auto; max-height: 480px; }
</style>
</head>
<body>
<div class="card">
  <div class="inner">
    <div style="text-align:center;margin-bottom:16px">
      <div style="display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.35);font-size:11px;letter-spacing:2px;font-family:system-ui,sans-serif;text-transform:uppercase">
          <span style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#DE3A2E,#b52a1e);display:flex;align-items:center;justify-content:center;font-size:14px">&#9875;</span>
          cargo <span style="color:rgba(255,255,255,0.6)">RUST</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.35);font-size:11px;letter-spacing:2px;font-family:system-ui,sans-serif;text-transform:uppercase">
          <span style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#326CE5,#1a4fa0);display:flex;align-items:center;justify-content:center;font-size:14px">&#9784;</span>
          helm <span style="color:rgba(255,255,255,0.6)">KUBERNETES</span>
        </div>
      </div>
      <h1 style="font-size:38px;font-weight:400;letter-spacing:10px;color:transparent;background:linear-gradient(135deg,#f7d794,#e8b550,#d4a843);-webkit-background-clip:text;background-clip:text;font-family:Georgia,'Times New Roman',serif;margin-bottom:2px">THE RUST PIRATE</h1>
      <p style="color:rgba(255,255,255,0.2);font-size:12px;letter-spacing:4px;text-transform:uppercase;font-family:system-ui,sans-serif">Sailing the container seas</p>
    </div>

    <div class="scene">
      <svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#DE3A2E" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#DE3A2E" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#E84C3D"/>
            <stop offset="100%" stop-color="#C0392B"/>
          </linearGradient>
          <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#333"/>
            <stop offset="100%" stop-color="#111"/>
          </linearGradient>
          <linearGradient id="k8sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#326CE5"/>
            <stop offset="100%" stop-color="#1a4fa0"/>
          </linearGradient>
          <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f7d794"/>
            <stop offset="100%" stop-color="#d4a843"/>
          </linearGradient>
          <filter id="shadow1"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/></filter>
          <filter id="shadow2"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/></filter>
        </defs>

        <ellipse cx="350" cy="330" rx="180" ry="50" fill="url(#glow)"/>

        <!-- legs -->
        <g fill="none" stroke="#C0392B" stroke-width="4" stroke-linecap="round" opacity="0.6">
          <path d="M250,330 C220,350 200,370 185,390"/>
          <path d="M260,340 C235,365 220,390 210,410"/>
          <path d="M275,348 C255,375 245,400 240,420"/>
          <path d="M290,353 C278,378 272,405 268,425"/>
          <path d="M450,330 C480,350 500,370 515,390"/>
          <path d="M440,340 C465,365 480,390 490,410"/>
          <path d="M425,348 C445,375 455,400 460,420"/>
          <path d="M410,353 C422,378 428,405 432,425"/>
        </g>

        <!-- body -->
        <circle cx="350" cy="270" r="100" fill="url(#bodyGrad)" filter="url(#shadow1)"/>
        <g fill="none" stroke="#b52a1e" stroke-width="1.5" opacity="0.22">
          <path d="M270,240 Q350,270 430,240"/>
          <path d="M260,260 Q350,295 440,260"/>
          <path d="M265,280 Q350,318 435,280"/>
          <path d="M280,300 Q350,335 420,300"/>
        </g>

        <!-- left arm + claw -->
        <path d="M260,230 C220,210 200,200 180,220 C160,240 150,260 155,280" fill="none" stroke="#C0392B" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M145,275 C130,255 130,235 145,225 C155,218 170,222 175,235 C180,248 172,265 160,275 Z" fill="#E84C3D" stroke="#C0392B" stroke-width="1.8"/>
        <path d="M150,265 C140,250 142,238 152,230" fill="none" stroke="#b52a1e" stroke-width="1.8"/>
        <path d="M155,275 C145,285 140,280 140,270" fill="none" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round"/>

        <!-- right arm + claw -->
        <path d="M440,230 C480,210 500,200 520,220 C540,240 550,260 545,280" fill="none" stroke="#C0392B" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M555,275 C570,255 570,235 555,225 C545,218 530,222 525,235 C520,248 528,265 540,275 Z" fill="#E84C3D" stroke="#C0392B" stroke-width="1.8"/>
        <path d="M550,265 C560,250 558,238 548,230" fill="none" stroke="#b52a1e" stroke-width="1.8"/>
        <path d="M545,275 C555,285 560,280 560,270" fill="none" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round"/>

        <!-- K8s wheel -->
        <g transform="translate(350, 200)" filter="url(#shadow2)">
          <circle cx="0" cy="0" r="65" fill="none" stroke="url(#k8sGrad)" stroke-width="6.5"/>
          <circle cx="0" cy="0" r="16" fill="#1a4fa0" stroke="#326CE5" stroke-width="2.5"/>
          <circle cx="0" cy="0" r="6.5" fill="#326CE5"/>
          <circle cx="0" cy="0" r="3" fill="#fff" opacity="0.2"/>
          <g fill="#326CE5" stroke="#2a5cd4" stroke-width="0.5">
            <polygon points="0,-61 -6.5,-26 6.5,-26" transform="rotate(0)"/>
            <polygon points="0,-61 -6.5,-26 6.5,-26" transform="rotate(51.4)"/>
            <polygon points="0,-61 -6.5,-26 6.5,-26" transform="rotate(102.9)"/>
            <polygon points="0,-61 -6.5,-26 6.5,-26" transform="rotate(154.3)"/>
            <polygon points="0,-61 -6.5,-26 6.5,-26" transform="rotate(205.7)"/>
            <polygon points="0,-61 -6.5,-26 6.5,-26" transform="rotate(257.1)"/>
            <polygon points="0,-61 -6.5,-26 6.5,-26" transform="rotate(308.6)"/>
          </g>
          <g fill="#fff" opacity="0.3">
            <circle cx="0" cy="-60" r="2.5" transform="rotate(0)"/>
            <circle cx="0" cy="-60" r="2.5" transform="rotate(51.4)"/>
            <circle cx="0" cy="-60" r="2.5" transform="rotate(102.9)"/>
            <circle cx="0" cy="-60" r="2.5" transform="rotate(154.3)"/>
            <circle cx="0" cy="-60" r="2.5" transform="rotate(205.7)"/>
            <circle cx="0" cy="-60" r="2.5" transform="rotate(257.1)"/>
            <circle cx="0" cy="-60" r="2.5" transform="rotate(308.6)"/>
          </g>
        </g>

        <!-- eye stalks -->
        <rect x="295" y="172" width="7" height="26" rx="3.5" fill="#C0392B"/>
        <rect x="398" y="172" width="7" height="26" rx="3.5" fill="#C0392B"/>

        <!-- eyes -->
        <circle cx="298" cy="166" r="12" fill="#fff" stroke="#C0392B" stroke-width="1.8"/>
        <circle cx="300" cy="164" r="6" fill="#1a1a2e"/>
        <circle cx="302" cy="161" r="2.2" fill="#fff" opacity="0.8"/>
        <circle cx="402" cy="166" r="12" fill="#fff" stroke="#C0392B" stroke-width="1.8"/>
        <circle cx="404" cy="164" r="6" fill="#1a1a2e"/>
        <circle cx="406" cy="161" r="2.2" fill="#fff" opacity="0.8"/>

        <!-- smile -->
        <path d="M320,310 Q350,328 380,310" fill="none" stroke="#8a1e14" stroke-width="2.2" stroke-linecap="round"/>

        <!-- pirate hat -->
        <g transform="translate(350, 120)" filter="url(#shadow2)">
          <path d="M-105,12 C-85,-10 -55,-22 0,-18 C55,-22 85,-10 105,12 C65,8 32,5 0,4 C-32,5 -65,8 -105,12 Z" fill="url(#hatGrad)"/>
          <path d="M-68,-8 C-63,-45 -33,-62 0,-72 C33,-62 63,-45 68,-8 C43,-3 18,-1 0,0 C-18,-1 -43,-3 -68,-8 Z" fill="#222"/>
          <path d="M-63,-6 C-33,-12 33,-12 63,-6" fill="none" stroke="#111" stroke-width="1.5"/>
          <path d="M-100,10 C-65,6 -32,4 0,3 C32,4 65,6 100,10" fill="none" stroke="url(#gold)" stroke-width="1.8" opacity="0.7"/>
          <path d="M-65,-5 C-38,-2 38,-2 65,-5" fill="none" stroke="url(#gold)" stroke-width="1.8" opacity="0.8"/>
          <!-- skull -->
          <g transform="translate(0, -35)">
            <ellipse cx="0" cy="0" rx="11" ry="9.5" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5"/>
            <circle cx="-4" cy="-2" r="3.2" fill="#1a1a1a"/>
            <circle cx="4" cy="-2" r="3.2" fill="#1a1a1a"/>
            <polygon points="0,2 -1.8,4.5 1.8,4.5" fill="#1a1a1a"/>
            <rect x="-5" y="5.5" width="2.8" height="2.8" rx="0.3" fill="#fff" stroke="#ddd" stroke-width="0.3"/>
            <rect x="2.2" y="5.5" width="2.8" height="2.8" rx="0.3" fill="#fff" stroke="#ddd" stroke-width="0.3"/>
            <line x1="-11" y1="-11" x2="11" y2="11" stroke="#ccc" stroke-width="2.8" stroke-linecap="round"/>
            <line x1="-11" y1="11" x2="11" y2="-11" stroke="#ccc" stroke-width="2.8" stroke-linecap="round"/>
          </g>
        </g>

        <!-- coins -->
        <g opacity="0.2">
          <circle cx="110" cy="140" r="9" fill="url(#gold)" stroke="#b8962e" stroke-width="1"/>
          <text x="110" y="144" text-anchor="middle" font-size="9" fill="#6b4c0a" font-family="serif">$</text>
          <circle cx="590" cy="150" r="8" fill="url(#gold)" stroke="#b8962e" stroke-width="1"/>
          <text x="590" y="154" text-anchor="middle" font-size="8" fill="#6b4c0a" font-family="serif">$</text>
          <circle cx="95" cy="200" r="6" fill="url(#gold)" stroke="#b8962e" stroke-width="0.8"/>
          <circle cx="605" cy="210" r="7" fill="url(#gold)" stroke="#b8962e" stroke-width="0.8"/>
          <text x="605" y="213" text-anchor="middle" font-size="7" fill="#6b4c0a" font-family="serif">$</text>
        </g>

        <!-- sparkles -->
        <g fill="rgba(255,255,255,0.08)">
          <polygon points="130,100 132,95 134,100 139,102 134,104 132,109 130,104 125,102"/>
          <polygon points="570,105 572,100 574,105 579,107 574,109 572,114 570,109 565,107"/>
          <polygon points="220,115 221,112 222,115 225,116 222,117 221,120 220,117 217,116"/>
          <polygon points="480,110 481,107 482,110 485,111 482,112 481,115 480,112 477,111"/>
        </g>
      </svg>
    </div>

    <div style="text-align:center;margin-top:10px">
      <p style="color:rgba(255,255,255,0.1);font-size:11px;letter-spacing:3px;font-family:system-ui,sans-serif">
        <span style="color:rgba(222,58,42,0.35)">cargo</span>
        <span style="color:rgba(255,255,255,0.12)"> x </span>
        <span style="color:rgba(50,108,229,0.35)">kubectl</span>
      </p>
    </div>
  </div>
</div>
</body>
</html>
