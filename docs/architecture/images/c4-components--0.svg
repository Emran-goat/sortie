<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" style="max-width:900px;font-family:system-ui,-apple-system,sans-serif;">
<rect width="900" height="500" fill="#fff"/>
<text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Sortie Component Diagram</text>

<rect x="30" y="60" width="840" height="390" rx="8" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="40" y="78" font-size="11" fill="#666" font-weight="bold">Engine (lib)</text>
<rect x="50" y="100" width="180" height="60" rx="6" fill="#DAE8FC" stroke="#4A7DB4" stroke-width="1.5"/>
<text x="140" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">build</text>
<text x="140" y="140" text-anchor="middle" font-size="11" fill="#444">cargo build --release</text>
<rect x="260" y="100" width="180" height="60" rx="6" fill="#DAE8FC" stroke="#4A7DB4" stroke-width="1.5"/>
<text x="350" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">ssh</text>
<text x="350" y="140" text-anchor="middle" font-size="11" fill="#444">SCP upload + SSH exec</text>
<rect x="470" y="100" width="180" height="60" rx="6" fill="#FFF2CC" stroke="#B8860B" stroke-width="1.5"/>
<text x="560" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">deploy</text>
<text x="560" y="140" text-anchor="middle" font-size="11" fill="#444">Orchestrator module</text>
<rect x="680" y="100" width="180" height="60" rx="6" fill="#DAE8FC" stroke="#4A7DB4" stroke-width="1.5"/>
<text x="770" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">systemd</text>
<text x="770" y="140" text-anchor="middle" font-size="11" fill="#444">Service file gen</text>
<rect x="170" y="260" width="180" height="60" rx="6" fill="#DAE8FC" stroke="#4A7DB4" stroke-width="1.5"/>
<text x="260" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">health</text>
<text x="260" y="300" text-anchor="middle" font-size="11" fill="#444">HTTP GET with timeout</text>
<rect x="470" y="260" width="180" height="60" rx="6" fill="#F8CECC" stroke="#A53D3D" stroke-width="1.5"/>
<text x="560" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">rollback</text>
<text x="560" y="300" text-anchor="middle" font-size="11" fill="#444">Restore .bak on fail</text>
<line x1="230" y1="130" x2="260" y2="130" stroke="#666" stroke-width="1.5" marker-end="none"/>
<polygon points="260,130 250,135 250,125" fill="#666" stroke="#666" stroke-width="1"/>
<text x="245" y="124" text-anchor="middle" font-size="10" fill="#555" transform=""></text>
<line x1="440" y1="130" x2="470" y2="130" stroke="#666" stroke-width="1.5" marker-end="none"/>
<polygon points="470,130 460,135 460,125" fill="#666" stroke="#666" stroke-width="1"/>
<text x="455" y="124" text-anchor="middle" font-size="10" fill="#555" transform=""></text>
<line x1="650" y1="130" x2="680" y2="130" stroke="#666" stroke-width="1.5" marker-end="none"/>
<polygon points="680,130 670,135 670,125" fill="#666" stroke="#666" stroke-width="1"/>
<text x="665" y="124" text-anchor="middle" font-size="10" fill="#555" transform=""></text>
<line x1="350" y1="160" x2="350" y2="260" stroke="#666" stroke-width="1.5" marker-end="none"/>
<polygon points="350,260 345,250 355,250" fill="#666" stroke="#666" stroke-width="1"/>
<text x="350" y="204" text-anchor="middle" font-size="10" fill="#555" transform="">deploy calls</text>
<line x1="560" y1="160" x2="560" y2="260" stroke="#666" stroke-width="1.5" marker-end="none"/>
<polygon points="560,260 555,250 565,250" fill="#666" stroke="#666" stroke-width="1"/>
<text x="560" y="204" text-anchor="middle" font-size="10" fill="#555" transform="">deploy calls on fail</text>

</svg>